name: Build HUNKART staff staging APKs
on:
  push:
    branches:
      - work/shop-acceptance-rider-dispatch
    paths:
      - dispatch-update/native-fcm/android-staging/**
      - .github/workflows/staff-staging-apk.yml
  workflow_dispatch:
    inputs:
      staging_url:
        description: Isolated HTTPS staging frontend origin (never hunkart.com)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate isolated frontend and stage Firebase client config
        shell: bash
        env:
          STAGING_URL: ${{ inputs.staging_url || 'https://25520cd1.koida-local-delivery.pages.dev' }}
          FIREBASE_CONFIG: ${{ secrets.HUNKART_STAGING_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [[ ! "$STAGING_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]] || [[ "$STAGING_URL" == *hunkart.com* ]]; then
            echo "Only an isolated HTTPS origin is allowed" >&2
            exit 1
          fi
          if [[ -z "$FIREBASE_CONFIG" ]]; then
            echo "Set HUNKART_STAGING_GOOGLE_SERVICES_JSON as a repository Actions secret" >&2
            exit 1
          fi
          mkdir -p dispatch-update/native-fcm/android-staging/app
          printf '%s' "$FIREBASE_CONFIG" > dispatch-update/native-fcm/android-staging/app/google-services.json
          python3 - <<'PY'
          import json
          p='dispatch-update/native-fcm/android-staging/app/google-services.json'
          data=json.load(open(p))
          packages={c['client_info']['android_client_info']['package_name'] for c in data['client']}
          assert data['project_info']['project_id']=='hunkart-staging'
          assert {'com.hunkart.shopkeeper.staging','com.hunkart.deliverypartner.staging'} <= packages
          PY
      - name: Build isolated staff APKs
        env:
          STAGING_URL: ${{ inputs.staging_url }}
        run: |
          gradle -p dispatch-update/native-fcm/android-staging \
            :app:assembleShopkeeperDebug :app:assembleRiderDebug \
            "-PstagingUrl=$STAGING_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: hunkart-staff-staging-apks
          path: dispatch-update/native-fcm/android-staging/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
