name: Build HUNKART Customer APK with H Icon
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/customer-apk-icon.yml'
      - 'customer-apk-assets.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install APK signing tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Replace only the customer app icon
        shell: bash
        run: |
          set -euo pipefail
          test -s customer-apk-assets.zip
          mkdir -p icon-build/res/drawable-nodpi-v4
          cd icon-build
          unzip -q ../customer-apk-assets.zip -d source
          unzip -q source/customer-base.apk AndroidManifest.xml classes.dex classes2.dex resources.arsc
          cp source/customer-icon.png res/drawable-nodpi-v4/hunkart_icon.png
          zip -q -X -0 ../unsigned.apk resources.arsc res/drawable-nodpi-v4/hunkart_icon.png
          zip -q -X -9 ../unsigned.apk AndroidManifest.xml classes.dex classes2.dex
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 ../unsigned.apk ../aligned.apk
          keytool -genkeypair -keystore ../customer-signing.jks -storepass android -keypass android -alias hunkart -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=HUNKART Customer'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks ../customer-signing.jks --ks-pass pass:android --key-pass pass:android --out ../HUNKART_customer_H_logo.apk ../aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose ../HUNKART_customer_H_logo.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging ../HUNKART_customer_H_logo.apk | grep '^package: name=' | grep "com.hunkart.delivery"
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: HUNKART_Customer_H_Logo_APK
          path: HUNKART_customer_H_logo.apk
          if-no-files-found: error
