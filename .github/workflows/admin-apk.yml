name: Build HUNKART Admin APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/admin-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: hunkart-admin-apk-release
      cancel-in-progress: false
    permissions:
      contents: write
