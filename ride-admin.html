<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUNKART Ride Admin</title><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#f3f6fb;font:16px Arial;color:#111827}header{background:#09182e;color:#fff;padding:22px}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:18px;margin:14px 0;box-shadow:0 4px 16px #0001}.row{border-bottom:1px solid #e5e7eb;padding:14px 0}.row:last-child{border:0}button,select,input{font:inherit;border:0;border-radius:10px;padding:11px;margin:4px}button{background:#1267e8;color:#fff;font-weight:700}.green{background:#00a844}.gray{background:#e5e7eb;color:#111827}.hidden{display:none}.photo{width:54px;height:54px;object-fit:cover;border-radius:50%;vertical-align:middle;margin-right:10px}.small{color:#677386;font-size:14px}.notice{background:#e8f0ff;padding:13px;border-radius:12px}input{border:1px solid #ccd4df;width:95%}</style></head><body><header><h1 style="margin:0">HUNKART</h1><div>Ride Admin Panel</div></header><main><div id="notice" class="notice">Sign in with your HUNKART admin account.</div><section id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Login</button></section><section id="app" class="hidden"><div class="card"><button id="refresh" class="gray">Refresh</button><button id="logout" class="gray">Logout</button></div><section class="card"><h2>Ride Partner Approval</h2><div id="partners"></div></section><section class="card"><h2>Manual Ride Assignment</h2><p class="small">Assigned rider must accept the ride in their app.</p><div id="rides"></div></section></section></main><script>const c=window.SPIDY_CONFIG||{},sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey),$=x=>document.getElementById(x);let partners=[];const say=x=>$("notice").textContent=x;const esc=x=>String(x??"").replace(/[&<>]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[x]));async function load(){let[a,b]=await Promise.all([sb.rpc("admin_get_ride_partners"),sb.rpc("admin_get_ride_bookings")]);if(a.error||b.error){say("Admin access error: "+(a.error||b.error).message);return}partners=a.data||[];$("partners").innerHTML=partners.length?partners.map(p=>`<div class="row">${p.photo_url?`<img class="photo" src="${p.photo_url}">`:""}<b>${esc(p.full_name)}</b><div class="small">${esc(p.phone)} · ${p.approved?"Approved":"Pending"} · ${p.is_online?"Online":"Offline"}</div><button class="${p.approved?"gray":"green"}" onclick="approve('${p.id}',${!p.approved})">${p.approved?"Remove approval":"Approve Ride Partner"}</button></div>`).join(""):"No registrations yet.";let rides=(b.data||[]).filter(r=>r.payment_status==="paid"&&r.status==="new"),approved=partners.filter(p=>p.approved);$("rides").innerHTML=rides.length?rides.map(r=>`<div class="row"><b>${esc(r.booking_number)}</b><div class="small">${esc(r.customer_name)} · ₹${esc(r.fare)}<br>${esc(r.pickup_label)} → ${esc(r.destination_label)}</div><select id="p-${r.id}"><option value="">Select Ride Partner</option>${approved.map(p=>`<option value="${p.id}">${esc(p.full_name)} (${esc(p.phone)})</option>`).join("")}</select><button class="green" onclick="assign('${r.id}')">Assign Ride</button></div>`).join(""):"No new paid ride waiting for assignment.";say("Ride Partner panel updated.")}async function approve(id,value){let{error}=await sb.rpc("admin_set_ride_partner_approval",{p_partner_id:id,p_approved:value});say(error?error.message:(value?"Ride Partner approved.":"Approval removed."));if(!error)load()}async function assign(id){let pid=$("p-"+id).value;if(!pid)return say("Select a Ride Partner first.");let{error}=await sb.rpc("admin_assign_ride_partner",{p_booking_id:id,p_partner_id:pid});say(error?error.message:"Ride assigned. Rider must accept it.");if(!error)load()}async function init(){let{data:{session}}=await sb.auth.getSession();$("login").classList.toggle("hidden",!!session);$("app").classList.toggle("hidden",!session);if(session)load()}$("loginBtn").onclick=async()=>{let{error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)return say(error.message);init()};$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("refresh").onclick=load;init();</script></body></html>
