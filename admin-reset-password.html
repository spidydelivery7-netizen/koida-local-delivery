<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Password Reset - HUNKART</title>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f7fb;
      color:#111827;
    }
    header{
      background:#0d1b2e;
      color:#fff;
      padding:24px 20px;
      font-size:25px;
      font-weight:800;
    }
    .wrap{
      max-width:650px;
      margin:60px auto;
      padding:20px;
    }
    .card{
      background:#fff;
      padding:32px;
      border-radius:22px;
      box-shadow:0 8px 30px rgba(0,0,0,.08);
    }
    h1{
      margin-top:0;
      font-size:32px;
    }
    p{
      color:#6b7280;
      line-height:1.6;
    }
    label{
      display:block;
      font-weight:700;
      margin:18px 0 8px;
    }
    input{
      width:100%;
      padding:16px;
      font-size:18px;
      border:1px solid #d1d5db;
      border-radius:12px;
    }
    button{
      width:100%;
      margin-top:22px;
      padding:16px;
      border:0;
      border-radius:12px;
      background:#0d1b2e;
      color:white;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
    }
    .status{
      margin-top:18px;
      padding:14px;
      border-radius:12px;
      display:none;
    }
    .ok{
      background:#d1fae5;
      color:#065f46;
      display:block;
    }
    .err{
      background:#fee2e2;
      color:#991b1b;
      display:block;
    }
    .info{
      background:#e0f2fe;
      color:#075985;
      display:block;
    }
    a{
      display:block;
      margin-top:22px;
      text-align:center;
      color:#0d1b2e;
      font-weight:700;
      text-decoration:none;
    }
  </style>
</head>

<body>

<header>HUNKART Admin</header>

<div class="wrap">
  <div class="card">

    <h1>Reset Admin Password</h1>

    <p>
      Open this page using the password-recovery link sent to the
      admin email address, then create a new admin password.
    </p>

    <div id="status" class="status info">
      Checking password reset link...
    </div>

    <div id="form" style="display:none">

      <label>New Password</label>
      <input
        id="password"
        type="password"
        autocomplete="new-password"
        placeholder="Enter new password"
      >

      <label>Confirm New Password</label>
      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Enter password again"
      >

      <button id="saveBtn">Save New Admin Password</button>

    </div>

    <a href="admin.html">Back to Admin Login</a>

  </div>
</div>

<script src="config.js"></script>

<script type="module">
  import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const cfg = window.SPIDY_CONFIG || {};

  const statusBox = document.getElementById("status");
  const form = document.getElementById("form");
  const saveBtn = document.getElementById("saveBtn");

  function showStatus(message, type="info"){
    statusBox.textContent = message;
    statusBox.className = "status " + type;
  }

  if(!cfg.supabaseUrl || !cfg.supabaseAnonKey){
    showStatus("Supabase configuration is missing.", "err");
  } else {

    const sb = createClient(
      cfg.supabaseUrl,
      cfg.supabaseAnonKey
    );

    async function checkRecoverySession(){

      const { data, error } = await sb.auth.getSession();

      if(error){
        showStatus("Could not verify reset link: " + error.message, "err");
        return;
      }

      if(data.session){
        showStatus(
          "Reset link verified. Enter your new admin password.",
          "ok"
        );
        form.style.display = "block";
      } else {
        showStatus(
          "This reset link is invalid or expired. Request a new admin password reset email.",
          "err"
        );
      }
    }

    sb.auth.onAuthStateChange((event, session)=>{
      if(event === "PASSWORD_RECOVERY" && session){
        showStatus(
          "Reset link verified. Enter your new admin password.",
          "ok"
        );
        form.style.display = "block";
      }
    });

    saveBtn.onclick = async ()=>{

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if(password.length < 8){
        showStatus(
          "Admin password must be at least 8 characters.",
          "err"
        );
        return;
      }

      if(password !== confirmPassword){
        showStatus(
          "Both passwords do not match.",
          "err"
        );
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving...";

      const { error } =
        await sb.auth.updateUser({ password });

      if(error){
        showStatus(
          "Password update failed: " + error.message,
          "err"
        );

        saveBtn.disabled = false;
        saveBtn.textContent = "Save New Admin Password";
        return;
      }

      await sb.auth.signOut();

      form.style.display = "none";

      showStatus(
        "Admin password updated successfully. You can now login to the Admin Panel with the new password.",
        "ok"
      );
    };

    checkRecoverySession();
  }
</script>

</body>
</html>
