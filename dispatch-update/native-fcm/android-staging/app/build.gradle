plugins { id 'com.android.application'; id 'com.google.gms.google-services' }
def stagingUrl=providers.gradleProperty('stagingUrl').orNull
if (!stagingUrl || !stagingUrl.startsWith('https://') || stagingUrl.contains('hunkart.com'))
 throw new GradleException('Pass -PstagingUrl=https://your-isolated-staging-host (production host is forbidden)')
android {
 namespace 'com.hunkart.staff.staging'
 compileSdk 35
 defaultConfig { minSdk 24; targetSdk 35; versionCode 1; versionName 'staging-1'; buildConfigField 'String','BASE_URL','"'+stagingUrl+'"' }
 buildFeatures { buildConfig true }
 flavorDimensions 'role'
 productFlavors {
  shopkeeper { dimension 'role'; applicationId 'com.hunkart.shopkeeper.staging'; buildConfigField 'String','PAGE_PATH','"/shopkeeper-app/"' }
  rider { dimension 'role'; applicationId 'com.hunkart.deliverypartner.staging'; buildConfigField 'String','PAGE_PATH','"/delivery-app/"' }
 }
}
dependencies { implementation platform('com.google.firebase:firebase-bom:34.5.0'); implementation 'com.google.firebase:firebase-messaging' }
