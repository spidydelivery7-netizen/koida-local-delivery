<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset PIN · Koida Local Delivery</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#111827}.top{background:#111827;color:#fff;padding:18px}.wrap{max-width:520px;margin:36px auto;padding:0 16px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 20px #0001}.brand{font-size:22px;font-weight:900}.small{font-size:13px;color:#6b7280;line-height:1.5}.status{margin:14px 0;padding:11px 13px;border-radius:10px;background:#eef2ff}.status.err{background:#fee2e2;color:#991b1b}.status.ok{background:#dcfce7;color:#166534}label{display:block;font-weight:800;font-size:14px;margin-top:14px}input{width:100%;margin-top:6px;padding:13px;border:1px solid #d1d5db;border-radius:11px;font-size:17px}button{width:100%;border:0;border-radius:11px;padding:13px 15px;margin-top:18px;font-weight:900;cursor:pointer}.dark{background:#111827;color:#fff}.dark:disabled{opacity:.55}.link{display:block;text-align:center;margin-top:15px;color:#111827;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="top"><div class="brand">Koida Local Delivery</div></div>
<div class="wrap"><div class="card">
<h2 style="margin-top:0">Create New 6-digit PIN</h2>
<p class="small">Open this page from the password-reset link sent to your registered email. Choose a new 6-digit PIN that you do not use for banking, UPI or ATM.</p>
<div id="status" class="status">Checking reset link...</div>
<div id="form" style="display:none">
<label>New 6-digit PIN<input id="pin1" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></label>
<label>Confirm New PIN<input id="pin2" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></label>
<button id="save" class="dark">Save New PIN</button>
</div>
<a class="link" href="/">Back to Koida Local Delivery</a>
</div></div>
<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const cfg=window.SPIDY_CONFIG||{},status=document.getElementById("status"),form=document.getElementById("form"),save=document.getElementById("save");
function setStatus(msg,type=""){status.textContent=msg;status.className="status"+(type?" "+type:"")}
function validPin(v){return /^\d{6}$/.test(v)}
if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){setStatus("Supabase configuration is missing.","err")}
else{
 const sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{storageKey:"kld-customer-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 async function ready(){
   const {data:{session}}=await sb.auth.getSession();
   if(session){setStatus("Reset link verified. Enter your new PIN.","ok");form.style.display="block";return true}
   setStatus("This reset link is invalid, expired, or was not opened from the recovery email. Request a new Forgot PIN link from the customer login page.","err");return false
 }
 sb.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"||session){setStatus("Reset link verified. Enter your new PIN.","ok");form.style.display="block"}});
 await new Promise(r=>setTimeout(r,250));await ready();
 save.onclick=async()=>{
   const p1=document.getElementById("pin1").value.trim(),p2=document.getElementById("pin2").value.trim();
   if(!validPin(p1)){setStatus("PIN must be exactly 6 digits.","err");return}if(p1!==p2){setStatus("PINs do not match.","err");return}
   save.disabled=true;save.textContent="Saving...";
   const {error}=await sb.auth.updateUser({password:`KLD#PIN#${p1}`});
   if(error){setStatus("Could not update PIN: "+error.message,"err");save.disabled=false;save.textContent="Save New PIN";return}
   setStatus("PIN updated successfully. You can now login with your email and new PIN.","ok");form.style.display="none";await sb.auth.signOut();
 };
}
</script>
</body>
</html>
