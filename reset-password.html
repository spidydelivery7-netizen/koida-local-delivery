<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset PIN | Koida Local Delivery</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7fb;color:#111827;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;box-shadow:0 12px 35px #0001}.brand{font-size:24px;font-weight:900;margin-bottom:4px}.brand span{color:#f59e0b}.muted{color:#6b7280;font-size:13px;line-height:1.5;margin-bottom:18px}label{display:block;font-weight:800;font-size:13px;margin-top:12px}input{width:100%;padding:13px 14px;margin-top:6px;border:1px solid #d1d5db;border-radius:11px;font-size:17px}.btn{width:100%;border:0;border-radius:12px;padding:13px 15px;background:#111827;color:#fff;font-weight:900;font-size:15px;margin-top:16px;cursor:pointer}.btn:disabled{opacity:.6}.status{margin-top:14px;padding:11px 12px;border-radius:10px;background:#f9fafb;border:1px solid #e5e7eb;font-size:13px;line-height:1.4}.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}.bad{background:#fff7ed;border-color:#fed7aa;color:#9a3412}.back{display:block;text-align:center;margin-top:14px;color:#111827;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Koida <span>Local Delivery</span></div>
  <div class="muted">Create a new 6-digit PIN for your customer account. Do not use your banking or UPI PIN.</div>
  <div id="formBox" style="display:none">
    <label>New 6-digit PIN<input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="••••••"></label>
    <label>Confirm New PIN<input id="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" placeholder="••••••"></label>
    <button id="save" class="btn">Save New PIN</button>
  </div>
  <div id="status" class="status">Checking your reset link...</div>
  <a class="back" href="/">← Back to Koida Local Delivery</a>
</div>
<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const cfg=window.SPIDY_CONFIG||{};
const status=document.getElementById("status"),formBox=document.getElementById("formBox"),save=document.getElementById("save");
const sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{storageKey:"kld-customer-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function setStatus(msg,type=""){status.textContent=msg;status.className="status"+(type?" "+type:"")}
function validPin(v){return /^\d{6}$/.test(String(v||""))}
async function showIfRecoverySession(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){formBox.style.display="block";setStatus("Reset link verified. Enter your new 6-digit PIN.","ok");return true}
  return false;
}
sb.auth.onAuthStateChange(async(event,session)=>{
  if(event==="PASSWORD_RECOVERY"||session){formBox.style.display="block";setStatus("Reset link verified. Enter your new 6-digit PIN.","ok")}
});
setTimeout(async()=>{if(!(await showIfRecoverySession()))setStatus("This reset link is invalid or expired. Go back and request a new Forgot PIN email.","bad")},1200);
save.onclick=async()=>{
  const pin=document.getElementById("pin").value.trim(),pin2=document.getElementById("pin2").value.trim();
  if(!validPin(pin)){setStatus("PIN must be exactly 6 digits.","bad");return}
  if(pin!==pin2){setStatus("PINs do not match.","bad");return}
  save.disabled=true;save.textContent="Saving...";
  const {error}=await sb.auth.updateUser({password:pin});
  if(error){setStatus("Could not update PIN: "+error.message,"bad");save.disabled=false;save.textContent="Save New PIN";return}
  setStatus("PIN changed successfully. You can now login with your email and new PIN.","ok");
  formBox.style.display="none";
  setTimeout(()=>{location.href="/"},1800);
};
</script>
</body>
</html>
