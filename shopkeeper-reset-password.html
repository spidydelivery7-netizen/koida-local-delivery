<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Shopkeeper Password - HUNKART</title>
<style>
:root{--dark:#111827;--bg:#f3f4f6;--card:#fff;--muted:#6b7280;--green:#16a34a;--red:#dc2626;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111827}
header{background:var(--dark);color:#fff}
.head{max-width:520px;margin:auto;padding:18px 16px}
.brand{font-size:22px;font-weight:900}.sub{font-size:13px;color:#cbd5e1;margin-top:3px}
.wrap{max-width:520px;margin:36px auto;padding:0 14px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 18px #0001}
h2{margin:0 0 6px}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.status{padding:11px 12px;border-radius:10px;background:#eef2ff;margin:14px 0;font-size:14px}
.status.ok{background:#dcfce7;color:#166534}.status.err{background:#fee2e2;color:#991b1b}
label{display:block;font-size:13px;font-weight:800;margin-top:14px}
input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;margin-top:6px}
button{width:100%;border:0;border-radius:10px;padding:12px 14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px}
.primary{background:var(--dark);color:#fff}
.back{display:block;text-align:center;color:var(--blue);text-decoration:none;font-weight:700;margin-top:16px}
</style>
</head>
<body>
<header><div class="head"><div class="brand">HUNKART</div><div class="sub">Shopkeeper Password Reset</div></div></header>
<main class="wrap">
  <section class="card">
    <h2>Set New Password</h2>
    <p class="small">Open this page from the password-reset email sent to your registered shopkeeper email.</p>
    <div id="status" class="status">Checking reset link...</div>
    <div id="form" style="display:none">
      <label>New Password
        <input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="Minimum 6 characters">
      </label>
      <label>Confirm New Password
        <input id="password2" type="password" autocomplete="new-password" minlength="6" placeholder="Re-enter password">
      </label>
      <button id="saveBtn" class="primary">Update Password</button>
    </div>
    <a class="back" href="/shopkeeper.html">Back to Shopkeeper Login</a>
  </section>
</main>

<script src="config.js"></script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const cfg=window.SPIDY_CONFIG||{};
const $=id=>document.getElementById(id);
const status=$("status");

function setStatus(msg,type=""){
  status.textContent=msg;
  status.className="status"+(type?" "+type:"");
}

if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){
  setStatus("Supabase configuration is missing.","err");
}else{
  const sb=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{
    auth:{
      storageKey:"kld-shopkeeper-auth",
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  });

  async function ready(){
    const {data:{session}}=await sb.auth.getSession();
    if(session){
      setStatus("Reset link verified. Enter your new password.","ok");
      $("form").style.display="block";
      return;
    }

    // Recovery links can take a moment to exchange the URL token.
    await new Promise(r=>setTimeout(r,700));
    const {data:{session:session2}}=await sb.auth.getSession();
    if(session2){
      setStatus("Reset link verified. Enter your new password.","ok");
      $("form").style.display="block";
    }else{
      setStatus("This reset link is invalid or expired. Request a new link from the Shopkeeper Login page.","err");
    }
  }

  sb.auth.onAuthStateChange((event,session)=>{
    if(event==="PASSWORD_RECOVERY" && session){
      setStatus("Reset link verified. Enter your new password.","ok");
      $("form").style.display="block";
    }
  });

  await ready();

  $("saveBtn").onclick=async()=>{
    const p=$("password").value;
    const p2=$("password2").value;
    if(p.length<6){setStatus("Password must be at least 6 characters.","err");return}
    if(p!==p2){setStatus("Passwords do not match.","err");return}

    $("saveBtn").disabled=true;
    $("saveBtn").textContent="Updating...";
    try{
      const {error}=await sb.auth.updateUser({password:p});
      if(error)throw error;
      setStatus("Password updated successfully. You can now login with the new password.","ok");
      $("form").style.display="none";
      setTimeout(()=>location.href="/shopkeeper.html",1200);
    }catch(e){
      setStatus("Could not update password: "+(e?.message||e),"err");
    }finally{
      $("saveBtn").disabled=false;
      $("saveBtn").textContent="Update Password";
    }
  };
}
</script>
</body>
</html>
